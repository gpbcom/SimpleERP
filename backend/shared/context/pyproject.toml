[project]
name = "erp-context"
version = "0.1.0"
description = "The company context and rights every SimpleERP service shares."
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = ["erp-models", "fastapi>=0.115", "pydantic>=2.9"]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.sources]
erp-models = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "erp_context"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --timeout=300"
