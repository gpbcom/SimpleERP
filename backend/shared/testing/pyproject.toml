[project]
name = "erp-testing"
version = "0.1.0"
description = "The test helpers every SimpleERP package shares: stand-in server, PostgreSQL test server, synthetic data."
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = ["erp-context", "erp-lifecycle", "erp-models", "pydantic>=2.9", "pytest>=8.4.0", "pyyaml>=6.0"]

[tool.uv.sources]
erp-context = { workspace = true }
erp-lifecycle = { workspace = true }
erp-models = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "erp_testing"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --timeout=300"
