[project]
name = "erp-logging"
version = "0.1.0"
description = "The logging setup every SimpleERP service shares: coloured console and rotating file."
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = ["colorlog>=6.12.0", "pyyaml>=6.0"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "erp_logging"
