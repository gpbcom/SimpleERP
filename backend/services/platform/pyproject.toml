[project]
name = "platform"
version = "0.1.0"
description = "The SimpleERP platform service."
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "erp-config",
    "erp-context",
    "erp-lifecycle",
    "erp-logging",
    "erp-models",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.sources]
erp-config = { workspace = true }
erp-context = { workspace = true }
erp-lifecycle = { workspace = true }
erp-logging = { workspace = true }
erp-models = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "erp_platform"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --timeout=300"
