name: Bug
description: Something that does not work as it should.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The steps, what you saw, what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots. No secret or personal data.
