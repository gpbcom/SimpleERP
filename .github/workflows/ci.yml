name: ci

# The entry point of the pipeline (AGENT.md, "CI/CD"): detect what changed, check only that (python.yml,
# typescript.yml, terraform.yml), then build, scan, sign and test the changed images (images.yml), published from
# develop and master only. The `result` job is the one check that says whether the whole run passed.

on:
  push:
    branches:
      - master
      - develop
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - develop
      - master
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.detect.outputs.services }}
      packages: ${{ steps.detect.outputs.packages }}
      typescript: ${{ steps.detect.outputs.typescript }}
      repository: ${{ steps.detect.outputs.repository }}
      terraform: ${{ steps.detect.outputs.terraform }}
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect what changed
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit, selecting everything."
            python3 .github/scripts/detect_changes.py --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" "$HEAD_SHA" | python3 .github/scripts/detect_changes.py >> "$GITHUB_OUTPUT"
          fi
          echo "Selected:"
          cat "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: >-
      needs.changes.outputs.services != '[]' || needs.changes.outputs.packages != '[]'
      || needs.changes.outputs.repository == 'true'
    uses: ./.github/workflows/python.yml
    with:
      services: ${{ needs.changes.outputs.services }}
      packages: ${{ needs.changes.outputs.packages }}
      repository: ${{ needs.changes.outputs.repository == 'true' }}

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript != '[]'
    uses: ./.github/workflows/typescript.yml
    with:
      projects: ${{ needs.changes.outputs.typescript }}

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform != '[]'
    uses: ./.github/workflows/terraform.yml
    with:
      folders: ${{ needs.changes.outputs.terraform }}

  images:
    needs: [changes, python, typescript, terraform]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.images != '[]' }}
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      images: ${{ needs.changes.outputs.images }}
      publish: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') }}

  result:
    needs: [changes, python, typescript, terraform, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a check failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -qE '"result": "(failure|cancelled)"'; then
            echo "::error::A check failed or was cancelled."
            exit 1
          fi
