name: helm

# Step 2 of the pipeline for the Helm charts (AGENT.md, "CI/CD"): helm lint, helm template and the validation of the
# rendered manifests against the Kubernetes schemas with kubeconform, with the commit as image tag. Reusable only:
# ci.yml and release.yml call it. It keeps its report as the test-report-helm artifact, failed runs included, for the
# release's test report (TKT-26).

on:
  workflow_call:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - name: Install kubeconform
        run: |
          file="kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$file" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/${file}"
          echo "$KUBECONFORM_SHA256  $file" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/kubeconform"
          tar --extract --gzip --file "$file" --directory "$RUNNER_TEMP/kubeconform"
          echo "$RUNNER_TEMP/kubeconform" >> "$GITHUB_PATH"
      - name: Lint, render and validate the charts
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: bash .github/scripts/check_helm.sh infra/helm "$IMAGE_TAG" reports
      - name: Keep the test reports (TKT-26)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-helm
          path: reports/
          if-no-files-found: ignore
