[project]
name = "project-docs"
version = "0.1.0"
description = "Maps a branch's changes to the project documentation chapters and checks that the documentation is complete (DOC-2)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "harness-core",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
project-docs = "project_docs.api.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "project_docs"

[tool.uv.sources]
harness-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers --import-mode=importlib --timeout=120"
