# How features and tickets are written on GitHub (rule GIT-10), read by IssueRules for the ticket-docs commands
# new-feature, new-ticket, apply-form, pin-links and check-issues. Created on 2026-11-11.

# The label of a feature: a parent issue whose sub-issues are its tickets.
feature_label: feature

# The feature families, each with the component labels its tickets may carry (the family matrix).
families:
  HARNESS: [HARNESS]
  SPECS: [SPECS]
  PRODUCT: [INFRA, BACKEND, FRONTEND]

# The component labels: a ticket carries exactly one.
components: [HARNESS, SPECS, INFRA, BACKEND, FRONTEND]

# A ticket's title: `[LABEL] Verb phrase`, the label being the ticket's component, under 80 characters.
title_pattern: '^\[(?P<label>[A-Z]+)\] [A-Z][^\n]*$'
title_max_length: 79

# The sections of a ticket's body, in this order (level-2 headings).
ticket_sections: [Description, Implementation, Acceptance criteria, Tests, References, Attachments]

# The sections of a feature's body, in this order.
feature_sections: [Goal, Specifications delivered, Out of scope, Tickets]

# The bold bullets of a ticket's Implementation section: `- **Approach:** ...`.
implementation_bullets: [Approach, Where, Contracts, Open questions]

# One acceptance criterion: `- [ ] **AC1** Given ..., when ..., then ... (ref)`.
acceptance_pattern: '^- \[[ xX]\] \*\*(?P<id>AC\d+)\*\* Given\b.+\bwhen\b.+\bthen\b.+$'

# The columns of the Tests and References tables.
tests_columns: [ID, Level, Proves, AC]
references_columns: [ID, What, Link]

# What a reference may point at: its kind is found from the permalink's path, and its ID must match one of the
# kind's patterns and appear in the file's path or content at the pinned commit.
reference_kinds:
  spec:
    paths: [docs/specs/]
    patterns:
      feature: 'f\d{2}'
      technical: 't\d{2}'
      decision: 'd\d{1,3}'
      business-rule: 'br-f\d{2}-\d{2}'
      entity: 'e-f\d{2}-\d{2}'
      flow: 'fl-f\d{2}-\d{2}'
      screen: 's-f\d{2}-\d{2}'
      use-case: 'uc-f\d{2}-\d{2}'
      question: 'q\d{1,3}'
      ux-view: 'u\d{2}'
      sector: 'sc\d{2}'
      # Non-functional pages, country rules and specification sections, named by their file or folder.
      page: '_?[a-z0-9]+(?:-[a-z0-9]+)*'
  harness:
    paths: [.claude/, .github/, AGENT.md, CLAUDE.md]
    patterns:
      rule: '(?:CS|GIT|DEP|TEST|DOC)-\d+'
      file: '[\w.-]+\.[a-z]+'

# The kind of reference every ticket of a component needs at least one of.
required_reference_kinds:
  HARNESS: harness
  SPECS: spec
  INFRA: spec
  BACKEND: spec
  FRONTEND: spec

# A permalink: a file of the repository pinned to a 40-character commit. `{repository}` is `owner/name`.
permalink: 'https://github.com/{repository}/blob/{sha}/{path}'
permalink_pattern: '^https://github\.com/{repository}/(?:blob|tree)/(?P<sha>[0-9a-f]{40})/(?P<path>[^#?]+)'
# Any link to a file or folder of the repository, pinned or not.
repository_link_pattern: '^https://github\.com/{repository}/(?:blob|tree)/'

# The relative links `ticket-docs pin-links` turns into permalinks.
pinned_prefixes: [docs/specs/, .claude/, AGENT.md, CLAUDE.md]

# `--type` of new-ticket: its label, and its Kind on the board.
type_labels:
  feature: type:feature
  bug: type:bug
  chore: type:chore
type_kinds:
  feature: Feature
  bug: Bug
  chore: Chore
default_type: feature

# `--priority`: its label, and its Priority on the board.
priority_labels:
  high: priority:high
  medium: priority:medium
  low: priority:low
priority_options:
  high: High
  medium: Medium
  low: Low
default_priority: medium

# The Kind of a feature on the board.
feature_kind: Feature

# The board statuses a new issue may start in, the first one by default.
new_issue_statuses: [Backlog, Ready]

# The first line of the comment the issues workflow keeps on a non-compliant issue.
comment_marker: '<!-- issue-check -->'

# What an issue form writes for a field left empty.
empty_form_answer: _No response_
