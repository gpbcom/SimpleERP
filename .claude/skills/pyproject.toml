[project]
name = "claude-harness"
version = "0.1.0"
description = "The Python tools of the simple-erp Claude Code harness."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ai-test-cost",
    "cve-scan",
    "harness-core",
    "pr-watch",
    "progress-updates",
    "project-docs",
    "release-notes",
    "ticket-docs",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "ai-test-cost",
    "cve-scan",
    "harness-core",
    "pr-watch",
    "progress-updates",
    "project-docs",
    "release-notes",
    "ticket-docs",
]

[tool.uv.sources]
ai-test-cost = { workspace = true }
cve-scan = { workspace = true }
harness-core = { workspace = true }
pr-watch = { workspace = true }
progress-updates = { workspace = true }
project-docs = { workspace = true }
release-notes = { workspace = true }
ticket-docs = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-html>=4.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.13.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "G", "PT", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045", "RUF012", "RUF100", "D100", "D104", "N818"]

[tool.ruff.lint.per-file-ignores]
"*/tests/**" = ["D"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ai_cost", "cve_scan", "harness_core", "pr_watch", "progress_updates", "project_docs", "release_notes", "tests", "ticket_docs"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib --timeout=120"
