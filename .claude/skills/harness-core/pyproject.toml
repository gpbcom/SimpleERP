[project]
name = "harness-core"
version = "0.1.0"
description = "What the harness tools share: lifecycle base classes, git and GitHub access, branch names, YAML catalogues, Markdown reading, logging and test stand-ins."
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harness_core"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers --import-mode=importlib --timeout=120"
