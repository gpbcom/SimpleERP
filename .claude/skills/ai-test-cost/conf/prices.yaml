# Price of each Claude model on the Claude API, per million tokens, in USD.
# The first entry whose `match` the model id contains wins, so a more specific entry comes first.
# A model no entry matches is priced as the most expensive entry (the highest output price), so that a run is never
# priced below its real cost.
# Claude Haiku 5.5 costs more for a prompt above 100,000 tokens ($0.50 input, $2.50 output). The usage report does not
# give the prompt size of each request, so that tier is not modelled: a run of such prompts is priced too low.
source: "Anthropic pricing page, Claude API first-party rates, https://platform.claude.com/docs/en/about-claude/pricing"
read_on: 2026-11-10
prices:
  - name: Claude Fable 5.1
    match: claude-fable-5-1
    input_per_mtok: "10.00"
    output_per_mtok: "50.00"
    cache_write_5m_per_mtok: "12.50"
    cache_write_1h_per_mtok: "20.00"
    cache_read_per_mtok: "0.25"
  - name: Claude Opus 5.5
    match: claude-opus-5-5
    input_per_mtok: "4.00"
    output_per_mtok: "20.00"
    cache_write_5m_per_mtok: "5.00"
    cache_write_1h_per_mtok: "8.00"
    cache_read_per_mtok: "0.20"
  - name: Claude Sonnet 5.5
    match: claude-sonnet-5-5
    input_per_mtok: "2.00"
    output_per_mtok: "10.00"
    cache_write_5m_per_mtok: "2.50"
    cache_write_1h_per_mtok: "4.00"
    cache_read_per_mtok: "0.10"
  - name: Claude Haiku 5.5
    match: claude-haiku-5-5
    input_per_mtok: "0.10"
    output_per_mtok: "0.50"
    cache_write_5m_per_mtok: "0.125"
    cache_write_1h_per_mtok: "0.20"
    cache_read_per_mtok: "0.01"
