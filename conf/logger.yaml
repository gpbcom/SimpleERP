version: 1
disable_existing_loggers: false

formatters:
  console:
    "()": colorlog.ColoredFormatter
    format: &format "%(asctime)s.%(msecs)03d - %(log_color)s%(levelname)s%(reset)s - %(cyan)s%(name)s%(reset)s - %(processName)s:%(process)d - %(threadName)s:%(thread)d - %(taskName)s - %(cyan)s%(filename)s:%(lineno)d%(reset)s - %(funcName)s - %(message_log_color)s%(message)s"
    datefmt: &datefmt "%Y-%m-%dT%H:%M:%S"
    # Colour is left out when the output is piped, so that a program reading it gets plain text.
    stream: ext://sys.stdout
    log_colors: &log_colors
      DEBUG: white
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: bold_red,bg_white
    secondary_log_colors: &secondary_log_colors
      message:
        WARNING: yellow
        ERROR: red
        CRITICAL: bold_red
  file:
    "()": colorlog.ColoredFormatter
    format: *format
    datefmt: *datefmt
    # A file is not a terminal, so colour has to be forced. Read it with `tail -f` or `less -R`.
    force_color: true
    log_colors: *log_colors
    secondary_log_colors: *secondary_log_colors

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: console
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: file
    filename: logs/simpleerp.log
    maxBytes: 10485760 # 10 MiB
    backupCount: 5
    encoding: utf-8

loggers:
  asyncio:
    level: WARNING

root:
  level: DEBUG
  handlers: [console, file]
